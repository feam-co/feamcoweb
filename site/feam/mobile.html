<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FEAM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--s1:rgba(28,28,30,.95);--s2:rgba(44,44,46,.7);
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.06);
  --text:#f5f5f7;--t2:rgba(245,245,247,.6);--t3:rgba(245,245,247,.3);
  --blue:#2997ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  overflow:hidden;
}

/* Topbar */
.topbar{height:50px;background:rgba(12,12,14,.98);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
.logo em{font-style:normal;color:var(--blue)}
.spacer{flex:1}
.pill{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;
  display:inline-flex;align-items:center;gap:5px}
.pill-green{background:rgba(48,209,88,.15);color:var(--green)}
.pill-red{background:rgba(255,69,58,.15);color:var(--red)}
.pill-gray{background:rgba(255,255,255,.07);color:var(--t3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Chat */
.chat{position:absolute;top:50px;bottom:112px;left:0;right:0;
  overflow-y:auto;padding:12px 12px 0;display:flex;flex-direction:column;gap:8px}
.chat::-webkit-scrollbar{display:none}

/* Messages */
.bubble{display:flex;flex-direction:column}
.bubble.me{align-items:flex-end}
.bubble.ai{align-items:flex-start}
.msg{max-width:90%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.55;word-break:break-word}
.me .msg{background:var(--blue);color:#fff;border-radius:18px 6px 18px 18px}
.ai .msg{background:var(--s1);border:1px solid var(--border);color:var(--text);border-radius:6px 18px 18px 18px}
.err .msg{background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.2);color:var(--red);border-radius:6px 18px 18px 18px}
.ts{font-size:10px;color:var(--t3);margin-top:3px;padding:0 4px}
.seal{font-size:10px;color:var(--green);margin-top:3px;padding:0 4px;font-family:monospace}

/* Output — terminal style */
.out{background:rgba(0,0,0,.6);border:1px solid var(--border2);border-radius:10px;
  padding:10px 12px;margin-top:8px;font-family:'SF Mono',Menlo,monospace;
  font-size:12px;line-height:1.7;color:#e8e8ea;white-space:pre-wrap;
  max-height:300px;overflow-y:auto;word-break:break-word}
.out::-webkit-scrollbar{width:3px}
.out::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* Shortcuts */
.shortcuts{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;
  border-top:1px solid var(--border2);flex-shrink:0;background:rgba(0,0,0,.5)}
.shortcuts::-webkit-scrollbar{display:none}
.sc{padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border);color:var(--t2);background:transparent;
  cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:all .15s}
.sc:active{background:rgba(41,151,255,.15);border-color:var(--blue);color:var(--blue)}

/* Input */
.input-wrap{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;
  background:rgba(10,10,12,.98);border-top:1px solid var(--border)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.inp{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--border);
  border-radius:22px;padding:10px 16px;color:var(--text);font-family:inherit;
  font-size:14px;outline:none;resize:none;max-height:100px;line-height:1.4;
  overflow-y:auto}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--t3)}
.send{width:42px;height:42px;border-radius:50%;background:var(--blue);
  border:none;color:#fff;font-size:19px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.send:active{transform:scale(.93)}
.send:disabled{background:rgba(41,151,255,.3);cursor:not-allowed;transform:none}

/* Typing */
.typing-wrap{display:flex;flex-direction:column;align-items:flex-start}
.typing{display:inline-flex;align-items:center;gap:5px;padding:10px 14px;
  background:var(--s1);border:1px solid var(--border);border-radius:6px 18px 18px 18px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--t3);
  animation:bounce .9s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
.typing-info{font-size:10px;color:var(--t3);padding:3px 4px;font-family:monospace}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">FEAM <em>OS</em></div>
  <div class="spacer"></div>
  <span class="pill pill-gray" id="status-pill">
    <span class="dot" style="animation:none"></span> bağlanıyor
  </span>
</div>

<div class="chat" id="chat"></div>

<div class="shortcuts">
  <button class="sc" onclick="ask('FEAM sistem durumunu ve aktif ajan sayısını göster')">⬡ Durum</button>
  <button class="sc" onclick="ask('Bugün bekleyen onayları ve risk uyarılarını listele')">⚠ Riskler</button>
  <button class="sc" onclick="ask('Aktif projeleri ve hakediş durumlarını özetle')">◧ Projeler</button>
  <button class="sc" onclick="ask('Fatura ve gelir istatistiklerini göster')">◑ Fatura</button>
  <button class="sc" onclick="ask('Son 5 Shahada zinciri bloğunu göster')">⛓ Zincir</button>
  <button class="sc" onclick="ask('IoT cihaz durumlarını ve son sensör verilerini göster')">📡 IoT</button>
</div>

<div class="input-wrap">
  <div class="input-row">
    <textarea class="inp" id="inp" placeholder="Ne yapmamı istersin?" rows="1"></textarea>
    <button class="send" id="send" onclick="send()">↑</button>
  </div>
</div>

<script>
const RELAY = 'https://feam.co/feam/relay.php';
const KEY   = 'feam-relay-2026';

let busy = false;

const chat = document.getElementById('chat');
const inp  = document.getElementById('inp');

function ts(){ return new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function scroll(){ chat.scrollTop = chat.scrollHeight; }

function addBubble(side, html, time, sealText){
  const b = document.createElement('div');
  b.className = `bubble ${side}`;
  b.innerHTML = `<div class="msg">${html}</div>`;
  if(time){ const t=document.createElement('div'); t.className='ts'; t.textContent=time; b.appendChild(t); }
  if(sealText){ const s=document.createElement('div'); s.className='seal'; s.textContent='🔐 '+sealText; b.appendChild(s); }
  chat.appendChild(b);
  scroll();
  return b;
}

function addTyping(){
  const b = document.createElement('div');
  b.className = 'typing-wrap';
  b.id = 'typing';
  b.innerHTML = `
    <div class="typing"><span></span><span></span><span></span></div>
    <div class="typing-info" id="typing-info">Claude Code çalışıyor…</div>`;
  chat.appendChild(b); scroll(); return b;
}

// Geçen süreyi güncelle
function startTimer(el){
  const t0 = Date.now();
  return setInterval(()=>{
    const s = Math.round((Date.now()-t0)/1000);
    if(el) el.textContent = `Claude Code çalışıyor… ${s}s`;
  }, 1000);
}

async function ask(prompt){ inp.value = prompt; await send(); }

async function send(){
  if(busy) return;
  const text = inp.value.trim();
  if(!text) return;
  inp.value = ''; inp.style.height='auto';
  setBusy(true);

  addBubble('me', esc(text), ts());

  const t = addTyping();
  const timer = startTimer(document.getElementById('typing-info'));

  try {
    // Komut gönder
    const r1 = await fetch(`${RELAY}?action=command`, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-API-Key':KEY},
      body: JSON.stringify({cmd:'workspace.run', payload:{prompt: text, model:'claude-sonnet-4-6'}}),
    });
    const d1 = await r1.json();
    if(!d1.ok) throw new Error(d1.error ?? 'Relay hatası');

    // Sonuç bekle
    const result = await waitResult(d1.session_id, document.getElementById('typing-info'));
    clearInterval(timer); t.remove();

    if(result.ok && result.data){
      const output = result.data.output ?? result.data.text ?? JSON.stringify(result.data, null, 2);
      const seal   = result.data.seal ?? null;
      addBubble('ai',
        `<div class="out">${esc(output)}</div>`,
        ts(), seal ? seal.substring(0,20)+'…' : null
      );
    } else {
      addBubble('err', `⚠ ${esc(result.error ?? 'Hata')}`, ts());
    }

  } catch(e){
    clearInterval(timer); t?.remove();
    addBubble('err', `⚠ ${esc(e.message)}`, ts());
  }

  setBusy(false);
}

async function waitResult(sid, infoEl, maxMs=180000){
  const t0 = Date.now();
  while(Date.now()-t0 < maxMs){
    await new Promise(r=>setTimeout(r,2500));
    try {
      const r = await fetch(`${RELAY}?action=result&session_id=${sid}`,{headers:{'X-API-Key':KEY}});
      const d = await r.json();
      if(d.session_id) return d;
    } catch {}
  }
  throw new Error('3 dakika içinde yanıt gelmedi — FEAM lokal çalışıyor mu?');
}

function setBusy(v){
  busy = v;
  document.getElementById('send').disabled = v;
  inp.disabled = v;
}

// Status check
async function checkStatus(){
  try {
    const r = await fetch(`${RELAY}?action=status`,{signal:AbortSignal.timeout(5000)});
    const d = await r.json();
    const p = document.getElementById('status-pill');
    if(d.relay==='online'){
      p.className='pill pill-green';
      p.innerHTML=`<span class="dot"></span> Canlı`;
    } else {
      p.className='pill pill-red';
      p.innerHTML=`<span class="dot" style="animation:none"></span> Kapalı`;
    }
  } catch {
    const p = document.getElementById('status-pill');
    p.className='pill pill-red';
    p.innerHTML='Bağlanamadı';
  }
}

// Input auto-resize
inp.addEventListener('input',()=>{
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,100)+'px';
});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

// Boot
addBubble('ai',
  'Selam Patron. Ne yapmamı istersin?<br><span style="font-size:12px;color:var(--t3)">Serbest yaz — proje durumu, site değişikliği, kod, her şey.</span>',
  ts()
);
checkStatus();
setInterval(checkStatus,30000);
</script>
</body>
</html>
